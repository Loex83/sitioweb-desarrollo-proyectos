<!-- 
    MEJORAS DE SEO Y METADATOS
    
    Copia y pega estos elementos en la sección <head> de tu index.html
    para mejorar tu posicionamiento en Google y en redes sociales
-->

<!-- ============================================================ -->
<!-- METADATOS BÁSICOS DE SEO -->
<!-- ============================================================ -->

<!-- Etiqueta de título (crítica para SEO) -->
<title>TechPyme - Diseño Web, Desarrollo Software y Automatización para PYMEs | Chile</title>

<!-- Descripción (aparece en resultados de Google) -->
<meta name="description" content="Soluciones digitales para PYMEs chilenas. Diseñamos sitios web, desarrollamos aplicaciones software y automatizamos procesos. Presupuestos justos, soporte local.">

<!-- Palabras clave (menos importante en 2024, pero ayuda) -->
<meta name="keywords" content="diseño web Chile, desarrollo software PYMEs, automatización digital, diseñador web Santiago, agencia digital">

<!-- Autor y derechos -->
<meta name="author" content="TechPyme">
<meta name="copyright" content="© 2024 TechPyme. Todos los derechos reservados.">

<!-- Idioma y región -->
<meta name="language" content="es">
<meta name="geo.placename" content="Santiago, Chile">
<meta name="geo.region" content="CL">

<!-- ============================================================ -->
<!-- METADATOS OPEN GRAPH (Redes Sociales) -->
<!-- ============================================================ -->

<!-- Cuando compartas en Facebook, LinkedIn, Twitter -->
<meta property="og:title" content="TechPyme - Soluciones Digitales para PYMEs">
<meta property="og:description" content="Diseño web, desarrollo de aplicaciones y automatizaciones para pequeñas y medianas empresas en Chile">
<meta property="og:image" content="https://tudominio.cl/og-image.png">
<meta property="og:url" content="https://tudominio.cl">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TechPyme">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TechPyme - Soluciones Digitales para PYMEs">
<meta name="twitter:description" content="Diseño web, desarrollo software y automatización">
<meta name="twitter:image" content="https://tudominio.cl/og-image.png">

<!-- ETIQUETAS DE SEGURIDAD Y COMPATIBILIDAD -->
<!-- ============================================================ -->

<!-- Evita ataques de clickjacking -->

<meta http-equiv="X-Frame-Options" content="SAMEORIGIN">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com;">

<!-- ============================================================ -->
<!-- CÓMO GENERAR IMÁGENES OG Y FAVICON -->
<!-- ============================================================ -->

<!--
1. FAVICON (16x16 px):
   - Usa: favicon-generator.org
   - O diseña en Canva
   - Guarda como "favicon.ico"

2. OG IMAGE (1200x630 px):
   - Usa: canva.com
   - Tamaño: 1200x630 píxeles
   - Guarda como: og-image.png
   - Sube a tu carpeta

3. APPLE ICON (180x180 px):
   - Usa: favicon-generator.org
   - O diseña en Canva
   - Guarda como: apple-touch-icon.png

Ejemplo de cómo crear en Canva:
- Ve a canva.com
- Busca "Social Media Graphics" o "favicon"
- Personaliza con tu logo y colores
- Descarga en PNG
-->

<!-- ============================================================ -->
<!-- ETIQUETAS CANÓNICAS (para evitar contenido duplicado) -->
<!-- ============================================================ -->

<link rel="canonical" href="https://tudominio.cl">

<!-- ============================================================ -->
<!-- PRELOAD Y PREFETCH (Mejora velocidad) -->
<!-- ============================================================ -->

<!-- Preload de fuentes -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

<!-- ============================================================ -->
<!-- VERIFICACIÓN EN GOOGLE Y BING -->
<!-- ============================================================ -->

<!-- Google Search Console -->
<meta name="google-site-verification" content="TU_CODIGO_DE_VERIFICACION">

<!-- Microsoft Bing -->
<meta name="msvalidate.01" content="TU_CODIGO_DE_VERIFICACION">

<!-- 
    Cómo obtener estos códigos:
    
    1. Google Search Console:
       - Ve a search.google.com/search-console
       - Agrega tu propiedad
       - Copia el meta tag de verificación
    
    2. Bing Webmaster Tools:
       - Ve a bing.com/webmasters
       - Agrega tu sitio
       - Copia el meta tag de verificación
-->
